<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Campanhas WhatsApp</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header>
        <div>
          <p class="eyebrow">GERADOR DE CAMPANHAS</p>
          <h1>Envio pelo WhatsApp</h1>
          <p class="sub">Envie uma mensagem individual e acompanhe o processamento da API.</p>
        </div>
        <div class="connection" id="connection"><span></span><b>Verificando...</b></div>
      </header>

      <section class="card access-card" id="accessCard">
        <h2>Acesso</h2>
        <p>Digite a senha do painel configurada na Vercel.</p>
        <form id="accessForm">
          <label>Senha de acesso<input id="accessToken" type="password" autocomplete="current-password" required /></label>
          <button type="submit">Entrar</button>
        </form>
      </section>

      <section class="card hidden" id="composer">
        <form id="sendForm">
          <label>Número com DDI e DDD
            <input id="to" inputmode="numeric" autocomplete="tel" placeholder="5511999999999" maxlength="15" required />
          </label>
          <label>Mensagem
            <textarea id="message" rows="7" maxlength="8000" placeholder="Escreva a mensagem..." required></textarea>
          </label>
          <div class="form-footer">
            <small id="counter">0 / 8000</small>
            <button id="sendButton" type="submit">Enviar mensagem</button>
          </div>
        </form>
        <div class="result hidden" id="result" role="status" aria-live="polite"></div>
      </section>

      <section class="card groups-card hidden" id="groupsCard">
        <div class="section-heading">
          <div><p class="eyebrow">GRUPOS</p><h2>Conversas em grupo</h2></div>
          <button class="secondary" id="refreshGroups" type="button">Atualizar lista</button>
        </div>
        <div class="group-grid">
          <form id="groupSendForm">
            <h3>Enviar para um grupo</h3>
            <label>Grupo
              <select id="groupSelect" required><option value="">Carregando grupos...</option></select>
            </label>
            <label>Mensagem
              <textarea id="groupMessage" rows="5" maxlength="8000" required></textarea>
            </label>
            <button id="groupSendButton" type="submit">Enviar para o grupo</button>
          </form>
          <form id="createGroupForm">
            <h3>Criar grupo</h3>
            <label>Nome do grupo
              <input id="groupName" maxlength="25" required />
            </label>
            <label>Participantes
              <textarea id="groupParticipants" rows="5" placeholder="Um número por linha, com DDI e DDD" required></textarea>
            </label>
            <button id="createGroupButton" type="submit">Criar grupo</button>
          </form>
        </div>
        <div class="result hidden" id="groupResult" role="status" aria-live="polite"></div>
      </section>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
